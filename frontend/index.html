<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Powered IDE — browser-based code editor with real-time collaboration, multi-model AI assistant, and LSP support." />
    <meta name="theme-color" content="#8B5CF6" />
    <title>AI Powered IDE</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

      #splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0B0B12;
        color: #8B5CF6;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        gap: 20px;
        position: relative;
        overflow: hidden;
      }

      #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 400px 300px at 50% 50%, rgba(139, 92, 246, 0.06), transparent);
      }

      #splash .logo-container {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      #splash svg {
        opacity: 0.3;
        animation: float 4s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash svg { animation: none; }
        #splash .loader::after { animation: none; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      #splash .brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ECECF4;
      }

      #splash .loader {
        width: 100px;
        height: 2px;
        background: rgba(139, 92, 246, 0.10);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
        z-index: 1;
      }

      #splash .loader::after {
        content: "";
        position: absolute;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #8B5CF6, transparent);
        border-radius: 2px;
        animation: slide 1.4s ease-in-out infinite;
      }

      @keyframes slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }

      #splash p {
        color: #6B6B85;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.04em;
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="logo-container">
          <svg viewBox="0 0 24 24" fill="currentColor" width="40" height="40">
            <path d="M12 2L14.09 8.26L20 9.27L15.55 13.97L16.91 20L12 16.9L7.09 20L8.45 13.97L4 9.27L9.91 8.26L12 2Z" />
          </svg>
          <span class="brand">AI Powered IDE</span>
        </div>
        <div class="loader"></div>
        <p>Initializing workspace...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
