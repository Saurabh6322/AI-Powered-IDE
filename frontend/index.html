<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Antigravity IDE — AI-powered browser-based code editor with real-time collaboration, multi-model AI assistant, and LSP support." />
    <meta name="theme-color" content="#6366f1" />
    <title>Antigravity IDE</title>
    <style>
      /* Splash screen shown before React hydrates */
      #splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0f1117;
        color: #6366f1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        gap: 16px;
      }
      #splash svg { animation: pulse-splash 1.5s ease-in-out infinite; }
      #splash p { color: #6b7280; font-size: 14px; }
      @keyframes pulse-splash {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
          <path d="M12 2L14.09 8.26L20 9.27L15.55 13.97L16.91 20L12 16.9L7.09 20L8.45 13.97L4 9.27L9.91 8.26L12 2Z" />
        </svg>
        <p>Loading Antigravity IDE...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
